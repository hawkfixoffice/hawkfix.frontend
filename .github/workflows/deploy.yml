name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  # Пересборка по кнопке — нужна после правки контента в Supabase,
  # потому что страницы статические и пересобираются на билде.
  workflow_dispatch:
  # Пересборка из внешнего триггера (вебхук Supabase → repository_dispatch)
  repository_dispatch:
    types: [content-updated]

permissions:
  contents: read
  pages: write
  id-token: write

# Параллельные деплои не нужны: держим один, новый отменяет предыдущий
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Pull content from Supabase
        # Если ключи не заданы — собираем из закоммиченного content/,
        # чтобы деплой не падал у того, у кого нет доступа к базе.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_SERVICE_KEY" ]; then
            npm run content:pull
          else
            echo "Ключи Supabase не заданы — собираю из content/ в репозитории"
          fi

      # Спрашиваем у Pages, на каком домене он реально опубликован: из этого
      # адреса собираются canonical, hreflang, og:image, sitemap и CNAME.
      # Шаг стоит ДО сборки именно ради base_url.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Build
        env:
          VITE_LEAD_ENDPOINT: ${{ vars.VITE_LEAD_ENDPOINT }}
          # Панель: адрес проекта и публикуемый ключ. Оба публичные
          # по назначению и продублированы в коде — переменные нужны,
          # только если решим их поменять. Ключей карт тут нет:
          # тайлы OpenFreeMap и Photon работают без ключа, а ключ
          # маршрутизатора живёт в секретах Supabase.
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
          # Коды подтверждения Search Console / Bing Webmaster / Яндекса —
          # публичные, задаются в Settings → Variables; без них тег не пишется.
          VITE_GOOGLE_SITE_VERIFICATION: ${{ vars.VITE_GOOGLE_SITE_VERIFICATION }}
          VITE_BING_SITE_VERIFICATION: ${{ vars.VITE_BING_SITE_VERIFICATION }}
          VITE_YANDEX_VERIFICATION: ${{ vars.VITE_YANDEX_VERIFICATION }}
          # Переменная репозитория перебивает автоопределение — на случай,
          # когда домен Pages и нужный адрес сборки расходятся.
          VITE_SITE: ${{ vars.VITE_SITE || steps.pages.outputs.base_url }}
        run: npm run build

      - name: Check output
        run: |
          pages=$(find dist -name index.html | wc -l | tr -d ' ')
          echo "Собрано страниц: $pages"
          test "$pages" -ge 140 || { echo "Ожидалось ≥140 страниц"; exit 1; }
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/404.html
          test -f dist/llms.txt
          test -f dist/llms-full.txt
          test -f dist/CNAME
          test -f dist/panel/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Карта сайта нужна шагу IndexNow после деплоя
      - uses: actions/upload-artifact@v4
        with:
          name: sitemap
          path: dist/sitemap.xml

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

      # Сообщаем Bing/Яндексу об обновлении (только боевой домен, см. скрипт).
      # Ошибка пинга деплой не валит.
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tools
      - uses: actions/download-artifact@v4
        with:
          name: sitemap
          path: dist
      - name: IndexNow
        continue-on-error: true
        run: node tools/indexnow.mjs
